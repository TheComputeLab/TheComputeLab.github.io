baseURL = 'https://TheComputeLab.github.io/'
languageCode = 'en-us'
title = 'The Compute Lab'
theme = 'hextra'
paginate = 10

[params]
  env = 'production'
  description = "Exploring AI, Data Science, and Quantum Computing"

  [params.author]
    name = "Mahesh"
    email = "maheshkolekarofc@gmail.com"

  DateFormat = "January 2, 2006"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  defaultTheme = "dark"


[[menu.main]]
identifier = "docs"
name = "Docs"
url = "/docs/"
weight = 5


